<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="csrf-token" content="{{ csrf_token() }}">

    <title>Admin — Joshim</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


    <div class="wrap">


        <header class="site-nav">

            <a href="/" class="brand" style="text-decoration:none;">
                Joshim
            </a>


            <nav>

                <a href="/courses-page">
                    View site
                </a>

                <a href="/admin/users" class="nav-cta">
                    Users
                </a>
                <a href="/admin/payments" class="nav-cta">
                    Payments
                </a>
                <a href="/admin/enrollments" class="nav-cta">

                    Enrollments
                </a>

                <a href="/logout" class="nav-cta">
                    Log out
                </a>

            </nav>


        </header>





        <section style="padding:50px 0 10px 0;">


            <div style="
            font-family:var(--font-mono);
            font-size:0.8rem;
            letter-spacing:0.08em;
            text-transform:uppercase;
            color:var(--accent-deep);
            margin-bottom:12px;">

                Admin

            </div>



            <h2 style="font-size:clamp(1.8rem,4vw,2.4rem);">

                Manage courses

            </h2>


        </section>






        <form id="courseForm"
        style="width:100%; max-width:480px; margin:0 0 40px 0;">



            <h3 id="formTitle" style="margin-bottom:16px;">

                Add a course

            </h3>




            <input 
            type="text"
            id="title"
            placeholder="Course title"
            required>



            <input 
            type="text"
            id="description"
            placeholder="Description"
            required>




            <input
            type="number"
            id="price"
            placeholder="Price (₦)"
            required>




            <input
            type="text"
            id="video_url"
            placeholder="Video URL"
            required>




            <button 
            type="submit"
            class="btn btn-accent"
            style="width:100%;">

                Save course

            </button>




            <p id="response"
            style="
            text-align:center;
            margin-top:12px;
            font-size:0.9rem;
            color:var(--slate);">

            </p>



        </form>







        <div id="courseList"></div>







        <section style="margin-top:60px;">
            <div class="eyebrow">
                Payments
            </div>

            <h3 style="margin-bottom:20px;">
                Manual payment management
            </h3>

            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="paymentsList">
                    </tbody>
                </table>
            </div>
        </section>

        <section style="margin-top:60px;">


            <h3 style="margin-bottom:16px;">

                Course requests ("Other" from registration)

            </h3>


            <div id="requestsList"></div>


        </section>








        <footer class="site-footer">


            <div>
                © 2026 Joshim. Online tutoring for kids.
            </div>


            <div>

                <a href="/">
                    Home
                </a>

            </div>


        </footer>





    </div>





    <script src="{{ url_for('static', filename='csrf.js') }}"></script>

    <script src="{{ url_for('static', filename='app.js') }}"></script>


</body>

</html>
