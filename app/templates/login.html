<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Log in — Joshim</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="wrap">
        <header class="site-nav">
            <a href="/" class="brand" style="text-decoration:none;">Joshim</a>
            <nav>
                <a href="/courses-page">Courses</a>
                <a href="/register-page" class="nav-cta">Sign up</a>
            </nav>
        </header>
    </div>

    <form id="loginForm">
        <h2 style="text-align:center; margin-bottom:20px;">Welcome back</h2>

        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit" class="btn btn-accent" style="width:100%;">Log in</button>

        <p id="response" style="text-align:center; margin-top:12px; font-size:0.9rem; color:var(--slate);"></p>

        <p style="text-align:center; margin-top:16px; font-size:0.9rem; color:var(--slate);">
            Don't have an account? <a href="/register-page">Sign up</a>
        </p>
    </form>

    <script src="{{ url_for('static', filename='csrf.js') }}"></script>
    <script src="{{ url_for('static', filename='login.js') }}"></script>

</body>
</html>
