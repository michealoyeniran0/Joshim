<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Log in — Joshim</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>

    <div class="wrap">
        <header class="site-nav">
            <a href="/" class="brand" style="text-decoration:none;">Joshim</a>
            <nav>
                <a href="/courses-page">Courses</a>
                <a href="/register-page" class="nav-cta">Sign up</a>
            </nav>
        </header>
    </div>
    
    <div class="login-box">
    <div class="auth-wrapper">

<form id="loginForm" class="auth-card">

<h2>Welcome back</h2>

<p class="auth-subtitle">
Login to continue learning with Joshim.
</p>

<input type="email" id="email" placeholder="Email" required>

<input type="password" id="password" placeholder="Password" required>

<button type="submit" class="btn btn-accent">
Log in
</button>

<p>
<a href="/forgot-password">Forgot password?</a>
</p>

<p id="response"></p>

<p>
Don't have an account?
<a href="/register-page">Sign up</a>
</p>

</form>

</div>

    <script src="{{ url_for('static', filename='csrf.js') }}"></script>
    <script src="{{ url_for('static', filename='login.js') }}"></script>

</body>
</html>
