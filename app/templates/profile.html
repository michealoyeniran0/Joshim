<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>My Profile — Joshim</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
</head>
<body>

<div class="wrap">

<header class="site-nav">

<a href="/" class="brand">
Joshim
</a>

<nav>

<a href="/student">
My courses
</a>


<div class="profile-menu">

<button class="profile-toggle">

<img src="/static/uploads/default.png" id="navProfileImg">

<span>
{{ current_user.name.split(' ')[0] }}
</span>

</button>


<div class="profile-dropdown">

<a href="/profile">
My Profile
</a>

<a href="#password">
Change Password
</a>

<a href="/logout">
Log out
</a>

</div>

</div>


</nav>

</header>
<section class="profile-header">
<div class="eyebrow">Profile</div>
<h2>My profile</h2>
<p>Manage your account details, child's information, and profile photo.</p>
</section>


<div class="profile-card">

<div class="profile-top">

<img id="profileImg"
src="/static/uploads/default.png"
alt="Profile picture">


<div>
<h3 id="profileName"></h3>
<p id="profileEmail"></p>
</div>

</div>


<div class="profile-fields">

<label>
Phone
</label>

<input type="text" id="profilePhone" placeholder="Phone number">


<label>
Child name
</label>

<input type="text" id="childName" placeholder="Child name">


<label>
Child class level
</label>

<input type="text" id="childClass" placeholder="Class level">


<button id="saveProfile" class="btn btn-accent">
Save changes
</button>


<p id="profileResponse"></p>

</div>



<div class="profile-divider"></div>


<form id="uploadForm">

<h3>Update profile photo</h3>

<input type="file" id="photoInput" accept="image/*">


<button type="submit" class="btn btn-accent">
Upload photo
</button>


<p id="uploadResponse"></p>


</form>


</div>



<footer class="site-footer">
<div>
© 2026 Joshim. Online tutoring for kids.
</div>

<div>
<a href="/">Home</a>
</div>
</footer>


</div>


<script src="{{ url_for('static', filename='csrf.js') }}"></script>
<script src="{{ url_for('static', filename='profile.js') }}"></script>
<script src="{{ url_for('static', filename='profile-nav.js') }}"></script>
</body>
</html>
