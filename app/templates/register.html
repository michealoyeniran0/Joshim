<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Register your child — Joshim</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>

    <div style="display:flex; min-height:100vh; flex-wrap:wrap;">

        <div style="flex:1; min-width:300px; background:var(--ink); position:relative; display:flex; align-items:flex-end; padding:40px;">
            <img src="{{ url_for('static', filename='images/hero.webp') }}"
                 alt=""
                 style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0.55;">
            <div style="position:relative; z-index:1;">
                <a href="/" style="color:#fff; text-decoration:none; font-family:var(--font-display); font-size:1.4rem;">Joshim</a>
                <h2 style="color:#fff; max-width:16ch; margin-top:20px;">Give your child a real tutor, wherever they are.</h2>
            </div>
        </div>

        <div style="flex:1; min-width:300px; display:flex; align-items:center; justify-content:center; padding:20px 40px;">
            <form id="registerForm" style="width:100%; max-width:420px; margin:0; box-shadow:none; border:none; background:transparent; padding:0;">
                <h2 style="margin-bottom: 6px;">Register your child</h2>
                <p style="color:var(--slate); font-size:0.9rem; margin-bottom:20px;">
                    You'll manage the account as the parent.
                </p>

                <label style="font-size:0.85rem; color:var(--slate);">Your name</label>
                <input type="text" id="name" placeholder="Your full name" required>

                <label style="font-size:0.85rem; color:var(--slate);">Your email</label>
                <input type="email" id="email" placeholder="Email" required>

                <label style="font-size:0.85rem; color:var(--slate);">Your phone number</label>
                <input type="tel" id="phone" placeholder="Phone number" required>

                <label style="font-size:0.85rem; color:var(--slate);">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>

                <hr style="border:none; border-top:1px solid var(--line); margin: 18px 0;">

                <label style="font-size:0.85rem; color:var(--slate);">Child's name</label>
                <input type="text" id="childName" placeholder="Child's full name" required>

                <label style="font-size:0.85rem; color:var(--slate);">Child's class level</label>
                <select id="childClassLevel" required style="width:100%; padding:11px 12px; margin:6px 0 14px 0; border:1px solid var(--line); border-radius:6px; font-family:var(--font-body); font-size:0.95rem; background:var(--paper);">
                    <option value="">Select class level</option>
                    <option value="Kindergarten">Kindergarten</option>
                    <option value="Grade 1">Grade 1</option>
                    <option value="Grade 2">Grade 2</option>
                    <option value="Grade 3">Grade 3</option>
                    <option value="Grade 4">Grade 4</option>
                    <option value="Grade 5">Grade 5</option>
                    <option value="Grade 6">Grade 6</option>
                    <option value="Grade 7">Grade 7</option>
                    <option value="Grade 8">Grade 8</option>
                    <option value="Grade 9">Grade 9</option>
                    <option value="Secondary/High School">Secondary/High School</option>
                </select>

                <label style="font-size:0.85rem; color:var(--slate);">Course</label>
                <select id="courseSelect" required style="width:100%; padding:11px 12px; margin:6px 0 6px 0; border:1px solid var(--line); border-radius:6px; font-family:var(--font-body); font-size:0.95rem; background:var(--paper);">
                    <option value="">Loading courses...</option>
                </select>
                <p id="courseDescription" style="font-size:0.85rem; color: green; margin:0 0 14px 0; min-height:18px;"></p>

                <div id="otherCourseWrap" style="display:none;">
                    <label style="font-size:0.85rem; color:var(--slate);">Tell us what course you're looking for</label>
                    <input type="text" id="otherCourse" placeholder="e.g. French lessons, Coding for beginners">
                </div>

                <button type="submit" class="btn btn-accent" style="width:100%;">Register</button>

                <p id="response" style="text-align:center; margin-top:12px; font-size:0.9rem; color:var(--slate);"></p>

                <p style="text-align:center; margin-top:8px; font-size:0.9rem; color:var(--slate);">
                    Already have an account? <a href="/login-page">Log in</a>
                </p>
            </form>
        </div>

    </div>

    <script src="{{ url_for('static', filename='csrf.js') }}"></script>
    <script src="{{ url_for('static', filename='register.js') }}"></script>

</body>
</html>
