<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses — Joshim</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="wrap">
        <header class="site-nav">
            <a href="/" class="brand" style="text-decoration:none;">Joshim</a>
            <nav>
                <span style="color:var(--slate); font-size:0.9rem;">Hi, {{ current_user.name.split(' ')[0] }}</span>
                <a href="/courses-page">Browse courses</a>
                <a href="/profile">My profile</a>
                <a href="/logout" class="nav-cta">Log out</a>
            </nav>
        </header>

        <section style="padding: 50px 0 10px 0;">
            <div style="font-family:var(--font-mono); font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent-deep); margin-bottom:12px;">
                Dashboard
            </div>
            <h2 style="font-size: clamp(1.8rem, 4vw, 2.4rem);">
                My courses
            </h2>
            <p style="color: var(--slate); max-width: 50ch; margin-top: 10px;">
                Pay to unlock a course you've enrolled in, or jump straight
                into one you've already paid for.
            </p>
        </section>

        <div id="myCourseList"></div>

        <footer class="site-footer">
            <div>© 2026 Joshim. Online tutoring for kids.</div>
            <div><a href="/legal">Terms & Privacy</a> · <a href="/">Home</a></div>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='student.js') }}"></script>

</body>
</html>
